<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý bán hàng</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; }
header { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 10; }
.header-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eee; }
h1 { font-size: 20px; }
nav { display: flex; padding: 0 20px; gap: 8px; overflow-x: auto; }
.tab-btn { background: none; border: none; padding: 12px 16px; font-size: 14px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tab-btn.active { color: #0071e3; border-bottom-color: #0071e3; }
main { padding: 20px; max-width: 1200px; margin: 0 auto; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.table-card { background: #fff; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: transform .15s, box-shadow .15s; border: 2px solid transparent; }
.table-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.table-card.occupied { background: #fff3e0; border-color: #ff9800; }
.table-card .name { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
.table-card .status { font-size: 12px; color: #888; }
.table-card.occupied .status { color: #e65100; font-weight: 500; }
.table-card .amount { font-size: 13px; color: #0071e3; font-weight: 600; margin-top: 4px; }

.btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: #0071e3; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #005bb5; }
.btn-danger { background: #ff3b30; color: #fff; }
.btn-secondary { background: #e5e5ea; color: #1d1d1f; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-icon { padding: 4px 8px; font-size: 16px; min-width: 28px; }

.menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.dish-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f0f0f0; }
.dish-row:last-child { border-bottom: none; }
.dish-info { flex: 1; }
.dish-name { font-weight: 500; }
.dish-price { font-size: 13px; color: #0071e3; margin-top: 2px; }
.dish-category { font-size: 12px; color: #888; margin-top: 2px; }
.dish-actions { display: flex; gap: 6px; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: #fff; border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 18px; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 16px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #fafafa; }

.order-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.order-item:last-child { border-bottom: none; }
.oi-info { flex: 1; }
.oi-name { font-weight: 500; }
.oi-price { font-size: 12px; color: #888; }
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 16px; font-weight: 600; }
.qty-num { min-width: 30px; text-align: center; font-weight: 500; }
.oi-total { font-weight: 600; color: #0071e3; min-width: 90px; text-align: right; }

.dish-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
.dish-pick { background: #f5f5f7; border: 2px solid transparent; border-radius: 10px; padding: 12px; cursor: pointer; text-align: left; transition: all .15s; }
.dish-pick:hover { background: #e8f0fe; border-color: #0071e3; }
.dish-pick .n { font-weight: 500; font-size: 14px; }
.dish-pick .p { font-size: 12px; color: #0071e3; margin-top: 4px; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
.form-group input:focus { outline: none; border-color: #0071e3; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.stat-label { font-size: 13px; color: #888; margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 700; color: #1d1d1f; }
.stat-value.green { color: #34c759; }
.report-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.report-filter button { padding: 8px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 13px; }
.report-filter button.active { background: #0071e3; color: #fff; border-color: #0071e3; }
.order-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
.order-row:last-child { border-bottom: none; }
.order-meta { font-size: 12px; color: #888; margin-top: 2px; }

.empty { text-align: center; padding: 40px; color: #999; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d1d1f; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; }
</style>
</head>
<body>

<header>
  <div class="header-top"><h1>🍜 Quản lý bán hàng</h1></div>
  <nav>
    <button class="tab-btn active" data-tab="tables">🪑 Bàn</button>
    <button class="tab-btn" data-tab="menu">🍽️ Menu</button>
    <button class="tab-btn" data-tab="reports">📊 Doanh thu</button>
  </nav>
</header>

<main>
  <!-- ===== TAB BÀN ===== -->
  <section class="tab-panel active" id="tab-tables">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px;align-items:center;">
      <h2 style="font-size:16px;">Danh sách bàn</h2>
      <button class="btn btn-primary btn-sm" onclick="addTable()">+ Thêm bàn</button>
    </div>
    <div class="tables-grid" id="tables-grid"></div>
  </section>

  <!-- ===== TAB MENU ===== -->
  <section class="tab-panel" id="tab-menu">
    <div class="menu-header">
      <h2 style="font-size:16px;">Menu món ăn</h2>
      <button class="btn btn-primary btn-sm" onclick="showDishForm()">+ Thêm món</button>
    </div>
    <div class="card" id="menu-list"></div>
  </section>

  <!-- ===== TAB DOANH THU ===== -->
  <section class="tab-panel" id="tab-reports">
    <h2 style="font-size:16px;margin-bottom:16px;">Doanh thu</h2>
    <div class="report-filter" id="report-filter">
      <button data-range="today" class="active">Hôm nay</button>
      <button data-range="week">7 ngày qua</button>
      <button data-range="month">Tháng này</button>
      <button data-range="all">Tất cả</button>
    </div>
    <div class="stat-grid" id="stat-grid"></div>
    <div class="card">
      <h3 style="margin-bottom:12px;font-size:15px;">Danh sách đơn đã thanh toán</h3>
      <div id="order-list"></div>
    </div>
  </section>
</main>

<div id="modal-root"></div>

<script>
// ============================================================
// 1. CÁC HÀM TIỆN ÍCH
// ============================================================
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = n => n.toLocaleString('vi-VN') + 'đ';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const formatTime = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
};

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ============================================================
// 2. LƯU / ĐỌC DỮ LIỆU (localStorage = lưu trong trình duyệt)
// ============================================================
const DB = {
  get(k, def) {
    const v = localStorage.getItem('pos_' + k);
    return v ? JSON.parse(v) : def;
  },
  set(k, v) { localStorage.setItem('pos_' + k, JSON.stringify(v)); }
};

// ============================================================
// 3. DỮ LIỆU MẪU LẦN ĐẦU MỞ APP
// ============================================================
function initData() {
  if (!DB.get('tables', null)) {
    DB.set('tables', [
      {id: 'b1', name: 'Bàn 1'}, {id: 'b2', name: 'Bàn 2'},
      {id: 'b3', name: 'Bàn 3'}, {id: 'b4', name: 'Bàn 4'},
      {id: 'b5', name: 'Bàn 5'}, {id: 'b6', name: 'Bàn 6'},
    ]);
  }
  if (!DB.get('dishes', null)) {
    DB.set('dishes', [
      {id: 'd1', name: 'Cà phê đen', price: 25000, category: 'Đồ uống', active: true},
      {id: 'd2', name: 'Cà phê sữa', price: 30000, category: 'Đồ uống', active: true},
      {id: 'd3', name: 'Trà đào', price: 35000, category: 'Đồ uống', active: true},
      {id: 'd4', name: 'Cơm gà', price: 45000, category: 'Món ăn', active: true},
      {id: 'd5', name: 'Phở bò', price: 50000, category: 'Món ăn', active: true},
    ]);
  }
  if (!DB.get('orders', null)) DB.set('orders', []);
}

// ============================================================
// 4. CHUYỂN TAB
// ============================================================
function switchTab(tab) {
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $$('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
  if (tab === 'tables') renderTables();
  if (tab === 'menu') renderMenu();
  if (tab === 'reports') renderReports();
}
$$('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// ============================================================
// 5. QUẢN LÝ BÀN
// ============================================================
function getOpenOrder(tableId) {
  return DB.get('orders', []).find(o => o.tableId === tableId && o.status === 'open');
}

function renderTables() {
  const tables = DB.get('tables', []);
  const orders = DB.get('orders', []);
  const grid = $('#tables-grid');
  grid.innerHTML = tables.map(t => {
    const order = orders.find(o => o.tableId === t.id && o.status === 'open');
    const total = order ? order.items.reduce((s,i) => s + i.price*i.qty, 0) : 0;
    return `
      <div class="table-card ${order ? 'occupied' : ''}" onclick="openTable('${t.id}')">
        <div class="name">${t.name}</div>
        <div class="status">${order ? 'Có khách' : 'Trống'}</div>
        ${order ? `<div class="amount">${fmt(total)}</div>` : ''}
      </div>`;
  }).join('');
}

function openTable(tableId) {
  const order = getOpenOrder(tableId);
  if (order) openOrderModal(order.id);
  else createOrder(tableId);
}

function createOrder(tableId) {
  const orders = DB.get('orders', []);
  const order = {
    id: uid(), tableId, items: [], status: 'open',
    createdAt: new Date().toISOString(), paidAt: null, paymentMethod: null, total: 0
  };
  orders.push(order);
  DB.set('orders', orders);
  openOrderModal(order.id);
}

function addTable() {
  const name = prompt('Tên bàn mới:');
  if (!name) return;
  const tables = DB.get('tables', []);
  tables.push({id: uid(), name});
  DB.set('tables', tables);
  renderTables();
  toast('Đã thêm bàn');
}

// ============================================================
// 6. MỞ ĐƠN HÀNG (MODAL)
// ============================================================
function openOrderModal(orderId) {
  const order = DB.get('orders', []).find(o => o.id === orderId);
  if (!order) return;
  const table = DB.get('tables', []).find(t => t.id === order.tableId);
  renderOrderModal(order, table);
}

function renderOrderModal(order, table) {
  const scrollTop = $('.modal-body')?.scrollTop || 0;
  const dishes = DB.get('dishes', []).filter(d => d.active !== false);
  const total = order.items.reduce((s,i) => s + i.price*i.qty, 0);

  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h2>${table ? table.name : 'Mang đi'}</h2>
          <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <h3 style="font-size:14px;color:#666;margin-bottom:8px;">Món đã gọi</h3>
          ${order.items.length === 0
            ? '<div class="empty">Chưa có món nào. Chọn món bên dưới để thêm.</div>'
            : order.items.map((it, idx) => `
                <div class="order-item">
                  <div class="oi-info">
                    <div class="oi-name">${it.name}</div>
                    <div class="oi-price">${fmt(it.price)}</div>
                  </div>
                  <div class="qty-ctrl">
                    <button class="qty-btn" onclick="changeQty('${order.id}',${idx},-1)">−</button>
                    <div class="qty-num">${it.qty}</div>
                    <button class="qty-btn" onclick="changeQty('${order.id}',${idx},1)">+</button>
                  </div>
                  <div class="oi-total">${fmt(it.price*it.qty)}</div>
                </div>`).join('')
          }
          <h3 style="font-size:14px;color:#666;margin:20px 0 0;">Thêm món</h3>
          <div class="dish-picker">
            ${dishes.length === 0 ? '<div class="empty">Chưa có món trong menu</div>' : dishes.map(d => `
              <div class="dish-pick" onclick="addDishToOrder('${order.id}','${d.id}')">
                <div class="n">${d.name}</div>
                <div class="p">${fmt(d.price)}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="modal-footer">
          <div>
            <div style="font-size:12px;color:#888;">Tổng cộng</div>
            <div style="font-size:22px;font-weight:700;color:#0071e3;">${fmt(total)}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-danger" onclick="cancelOrder('${order.id}')">Huỷ đơn</button>
            <button class="btn btn-primary" ${order.items.length===0?'disabled':''} onclick="checkout('${order.id}')">Thanh toán</button>
          </div>
        </div>
      </div>
    </div>`;

  const body = $('.modal-body');
  if (body) body.scrollTop = scrollTop;
}

function closeModal() { $('#modal-root').innerHTML = ''; }

function addDishToOrder(orderId, dishId) {
  const orders = DB.get('orders', []);
  const order = orders.find(o => o.id === orderId);
  const dish = DB.get('dishes', []).find(d => d.id === dishId);
  const existing = order.items.find(i => i.dishId === dishId);
  if (existing) existing.qty++;
  else order.items.push({dishId, name: dish.name, price: dish.price, qty: 1});
  DB.set('orders', orders);
  const table = DB.get('tables', []).find(t => t.id === order.tableId);
  renderOrderModal(order, table);
}

function changeQty(orderId, idx, delta) {
  const orders = DB.get('orders', []);
  const order = orders.find(o => o.id === orderId);
  order.items[idx].qty += delta;
  if (order.items[idx].qty <= 0) order.items.splice(idx, 1);
  DB.set('orders', orders);
  const table = DB.get('tables', []).find(t => t.id === order.tableId);
  renderOrderModal(order, table);
}

function cancelOrder(orderId) {
  if (!confirm('Huỷ đơn này? Toàn bộ món sẽ bị xoá.')) return;
  const orders = DB.get('orders', []).filter(o => o.id !== orderId);
  DB.set('orders', orders);
  closeModal();
  renderTables();
  toast('Đã huỷ đơn');
}

function checkout(orderId) {
  const method = prompt('Phương thức thanh toán (tiền mặt / chuyển khoản / momo):', 'tiền mặt');
  if (!method) return;
  const orders = DB.get('orders', []);
  const order = orders.find(o => o.id === orderId);
  order.status = 'paid';
  order.paidAt = new Date().toISOString();
  order.paymentMethod = method;
  order.total = order.items.reduce((s,i) => s + i.price*i.qty, 0);
  DB.set('orders', orders);
  closeModal();
  renderTables();
  toast('Đã thanh toán ' + fmt(order.total));
}

// ============================================================
// 7. QUẢN LÝ MENU (THÊM / SỬA / XOÁ MÓN)
// ============================================================
function renderMenu() {
  const dishes = DB.get('dishes', []);
  const list = $('#menu-list');
  if (dishes.length === 0) {
    list.innerHTML = '<div class="empty">Chưa có món nào. Bấm "+ Thêm món".</div>';
    return;
  }
  list.innerHTML = dishes.map(d => `
    <div class="dish-row">
      <div class="dish-info">
        <div class="dish-name">${d.name}</div>
        <div class="dish-price">${fmt(d.price)}</div>
        <div class="dish-category">${d.category || 'Không có danh mục'}</div>
      </div>
      <div class="dish-actions">
        <button class="btn btn-secondary btn-sm" onclick="showDishForm('${d.id}')">Sửa</button>
        <button class="btn btn-danger btn-sm" onclick="deleteDish('${d.id}')">Xoá</button>
      </div>
    </div>`).join('');
}

function showDishForm(dishId) {
  const dish = dishId
    ? DB.get('dishes', []).find(d => d.id === dishId)
    : {name:'', price:'', category:''};
  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:420px;">
        <div class="modal-header">
          <h2>${dishId ? 'Sửa món' : 'Thêm món'}</h2>
          <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Tên món</label>
            <input id="df-name" value="${dish.name}" placeholder="VD: Cà phê sữa">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Giá (VNĐ)</label>
              <input id="df-price" type="number" value="${dish.price}" placeholder="30000">
            </div>
            <div class="form-group">
              <label>Danh mục</label>
              <input id="df-cat" value="${dish.category}" placeholder="Đồ uống">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Huỷ</button>
          <button class="btn btn-primary" onclick="saveDish('${dishId || ''}')">Lưu</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => $('#df-name')?.focus(), 50);
}

function saveDish(dishId) {
  const name = $('#df-name').value.trim();
  const price = parseInt($('#df-price').value);
  const category = $('#df-cat').value.trim();
  if (!name || !price) { alert('Vui lòng nhập tên và giá'); return; }
  const dishes = DB.get('dishes', []);
  if (dishId) {
    Object.assign(dishes.find(x => x.id === dishId), {name, price, category});
  } else {
    dishes.push({id: uid(), name, price, category, active: true});
  }
  DB.set('dishes', dishes);
  closeModal();
  renderMenu();
  toast('Đã lưu');
}

function deleteDish(dishId) {
  if (!confirm('Xoá món này khỏi menu?')) return;
  DB.set('dishes', DB.get('dishes', []).filter(d => d.id !== dishId));
  renderMenu();
  toast('Đã xoá');
}

// ============================================================
// 8. BÁO CÁO DOANH THU
// ============================================================
let reportRange = 'today';

function getRangeDates(range) {
  const now = new Date();
  const start = new Date(now);
  start.setHours(0,0,0,0);
  if (range === 'week') start.setDate(start.getDate() - 6);
  else if (range === 'month') start.setDate(1);
  else if (range === 'all') return {start: new Date(0), end: new Date(now.getTime() + 86400000)};
  return {start, end: now};
}

function renderReports() {
  const {start, end} = getRangeDates(reportRange);
  const orders = DB.get('orders', []).filter(o =>
    o.status === 'paid' && o.paidAt &&
    new Date(o.paidAt) >= start && new Date(o.paidAt) <= end
  ).sort((a,b) => new Date(b.paidAt) - new Date(a.paidAt));

  const total = orders.reduce((s,o) => s + o.total, 0);
  $('#stat-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Tổng doanh thu</div>
      <div class="stat-value green">${fmt(total)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Số đơn</div>
      <div class="stat-value">${orders.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Trung bình / đơn</div>
      <div class="stat-value">${orders.length ? fmt(Math.round(total/orders.length)) : '0đ'}</div>
    </div>`;

  $('#order-list').innerHTML = orders.length === 0
    ? '<div class="empty">Chưa có đơn nào</div>'
    : orders.map(o => {
        const t = DB.get('tables', []).find(x => x.id === o.tableId);
        return `
          <div class="order-row">
            <div>
              <div>${t ? t.name : 'Mang đi'} <span style="color:#888;">• ${o.paymentMethod || ''}</span></div>
              <div class="order-meta">${formatTime(o.paidAt)} • ${o.items.length} món</div>
            </div>
            <div style="font-weight:600;color:#0071e3;">${fmt(o.total)}</div>
          </div>`;
      }).join('');
}

$$('#report-filter button').forEach(b => b.addEventListener('click', () => {
  $$('#report-filter button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  reportRange = b.dataset.range;
  renderReports();
}));

// ============================================================
// 9. KHỞI ĐỘNG
// ============================================================
initData();
renderTables();
</script>
</body>
</html>
